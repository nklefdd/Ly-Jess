<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профіль - Ly-Jess</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">Ly-Jess</a>
    <span class="tagline">Зоомагазин</span>
  </header>
  <main class="card">
    <div class="profile-head">
      <h1 id="greeting">Профіль</h1>
      <span id="role" class="badge"></span>
    </div>
    <form id="profile-form">
      <label>Ім’я
        <input name="first_name" type="text" >
      </label>
      <p class="field-error" data-error-for="first_name"></p>
      <label>Прізвище
        <input name="last_name" type="text" >
      </label>
      <p class="field-error" data-error-for="last_name"></p>
      <label>Email
        <input name="email" type="email" required>
      </label>
      <p class="field-error" data-error-for="email"></p>
      <label>Телефон
        <input name="phone" type="tel" placeholder="+380XXXXXXXXX">
      </label>
      <p class="field-error" data-error-for="phone"></p>
      <p class="form-error"></p>
      <p id="saved" class="success"></p>
      <button type="submit">Зберегти</button>
    </form>
    <button id="logout" class="secondary">Вийти</button>
  </main>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
